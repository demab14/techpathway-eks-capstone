# Example only - real secrets are created with kubectl create secret, never committed
apiVersion: v1
kind: Secret
metadata:
  name: weekly-call-secret
  namespace: techpathway
type: Opaque
stringData:
  SECRET_KEY: "<generate with: openssl rand -hex 32>"
---
apiVersion: v1
kind: Secret
metadata:
  name: action-messages-secret
  namespace: techpathway
type: Opaque
stringData:
  SMTP_USER: ""
  SMTP_PASSWORD: ""
