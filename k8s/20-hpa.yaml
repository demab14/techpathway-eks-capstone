apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: action-messages
  namespace: techpathway
spec:
  maxReplicas: 6
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 50
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: action-messages
status:
  currentMetrics: null
  desiredReplicas: 0
---
