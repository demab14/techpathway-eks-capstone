apiVersion: apps/v1
kind: Deployment
metadata:
  name: techpathway-warehouse
  namespace: techpathway
  labels: { app: techpathway-warehouse }
spec:
  # no "replicas": the HorizontalPodAutoscaler owns the replica count
  selector:
    matchLabels: { app: techpathway-warehouse }
  template:
    metadata:
      labels: { app: techpathway-warehouse }
    spec:
      containers:
        - name: techpathway-warehouse
          image: 743676310994.dkr.ecr.eu-west-2.amazonaws.com/techpathway-warehouse:v1
          ports:
            - containerPort: 5002
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 5002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5002 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: techpathway-warehouse
  namespace: techpathway
  labels: { app: techpathway-warehouse }
spec:
  type: LoadBalancer
  selector: { app: techpathway-warehouse }
  ports:
    - port: 5002
      targetPort: 5002
