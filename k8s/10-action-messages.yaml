apiVersion: apps/v1
kind: Deployment
metadata:
  name: action-messages
  namespace: techpathway
  labels: { app: action-messages }
spec:
  replicas: 1
  selector:
    matchLabels: { app: action-messages }
  template:
    metadata:
      labels: { app: action-messages }
    spec:
      containers:
        - name: action-messages
          image: 743676310994.dkr.ecr.eu-west-2.amazonaws.com/action-messages:v1
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef: { name: action-messages-config }
            - secretRef:    { name: action-messages-secret }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: action-messages
  namespace: techpathway
  labels: { app: action-messages }
spec:
  type: LoadBalancer
  selector: { app: action-messages }
  ports:
    - port: 5001
      targetPort: 5001
